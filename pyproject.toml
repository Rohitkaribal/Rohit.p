[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-omni"
version = "0.1.0"
description = "Multi-stage, multi-model collective reasoning engine (Omega Omni)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omega Omni" }]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-generativeai>=0.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
omega-omni = "omega_omni.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omega_omni*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
