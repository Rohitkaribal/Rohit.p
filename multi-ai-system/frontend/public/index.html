<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-AI System - Rohit's All-in-One, All-Rounder AI System" />
    <title>Multi-AI System - Omega Core</title>
    <style>
      /* Demo Mode Label - Always Visible */
      .demo-mode-label {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: #ff0000;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
        z-index: 10000;
        border: 2px solid #ff0000;
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
      }
      
      /* Loading screen */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* Responsive base */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Demo Mode Label -->
    <div class="demo-mode-label">DEMO MODE</div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
